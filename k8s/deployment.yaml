
apiVersion: apps/v1
kind: Deployment

metadata:
  name: muscle-ai

spec:
  replicas: 3

  selector:
    matchLabels:
      app: muscle-ai

  template:
    metadata:
      labels:
        app: muscle-ai

    spec:
      
      containers:
        - name: muscle-ai
          image: muscle-ai-prod:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: muscle-ai-config
            - secretRef:
                name: muscle-ai-demo-secret



