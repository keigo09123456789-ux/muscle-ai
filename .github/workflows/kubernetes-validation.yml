name: Kubernetes Validation

on:
  push:
    paths:
      - "k8s/**"
      - ".github/workflows/kubernetes-validation.yml"
  pull_request:
    paths:
      - "k8s/**"
      - ".github/workflows/kubernetes-validation.yml"

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes YAML
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 k8s/

      - name: Validate replica count
        run: |
          python3 -m pip install --user PyYAML
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          for path in Path("k8s").glob("*.yaml"):
              for doc in yaml.safe_load_all(path.read_text()):
                  if not isinstance(doc, dict):
                      continue
                  if doc.get("kind") in ("Deployment", "ReplicaSet", "StatefulSet"):
                      replicas = doc.get("spec", {}).get("replicas", 1)
                      if not isinstance(replicas, int) or isinstance(replicas, bool) or replicas < 0:
                          raise SystemExit(f"Invalid replicas in {path}: {replicas}")

          print("Replica count validation passed")
          PY